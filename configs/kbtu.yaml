# Конфиг тенанта KBTU для ingestion движка A (docs/00 §7.5).
# Config-driven: новый вуз = новый такой YAML, без изменения кода.
university_name: "Казахстанско-Британский технический университет (KBTU)"
tenant_id: kbtu
language: ru
base_url: "https://kbtu.edu.kz"

chunk:
  target_tokens: 700        # целевой размер чанка (docs/00 §14)
  max_tokens: 1000          # жёсткий максимум (текст; таблицы атомарны и могут быть больше)
  overlap_tokens: 90        # ~12% overlap (на token-window ветке)
  min_tokens: 12            # отбрасывать короткие текстовые обрывки/колонтитулы
  tokenizer: cl100k_base    # токенайзер OpenAI text-embedding-3 (ADR-007)

embedding:
  # ФАКТ текущего индекса: local (MiniLM-384, демо — ADR-018). Прод: openai (3072).
  # ⚠️ Ключ пока ИНФОРМАЦИОННЫЙ: код читает --profile / EMBED_PROFILE, не этот YAML
  # (задача: подключить чтение конфига). Смена профиля = полная переиндексация (§2.10).
  profile: local


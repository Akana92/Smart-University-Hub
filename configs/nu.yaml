# Конфиг тенанта Nazarbayev University (мультивуз, TASK-025). Контент англоязычный —
# витрина «зарубеж-стиля» (своя модель: NUET + IELTS + Foundation Year, не ЕНТ-грант).
university_name: "Nazarbayev University (NU)"
tenant_id: nu
language: en
base_url: "https://nu.edu.kz"

chunk:
  target_tokens: 700
  max_tokens: 1000
  overlap_tokens: 90
  min_tokens: 12
  tokenizer: cl100k_base

embedding:
  profile: openai   # text-embedding-3-large мультиязычен → англ-контент ок; советник отвечает по-русски


# Инфраструктура движка B: Postgres (продовый стор, docs/03 §4.4).
# Поднять:   docker compose -f api/docker-compose.yml up -d
# Загрузить: DATABASE_URL=postgresql://postgres:postgres@localhost:5432/smartuni python api/load_postgres.py
# Запустить API против Postgres:
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5432/smartuni uvicorn api.main:app --reload
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartuni
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:

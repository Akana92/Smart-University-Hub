[pytest]
# Собираем только tests/. НЕ рекурсируем в poc/: у POC движка B свой пакет `api`,
# и прямой сбор poc/grant-recommender/api/test_api.py кэширует его в sys.modules,
# перекрывая корневой пакет `api` (RAG-API движка A) → ImportError в test_rag_api.
# POC всё равно покрыт: tests/test_poc_api.py запускает его набор subprocess'ом.
testpaths = tests
norecursedirs = poc .git __pycache__ data logs eval .venv node_modules
